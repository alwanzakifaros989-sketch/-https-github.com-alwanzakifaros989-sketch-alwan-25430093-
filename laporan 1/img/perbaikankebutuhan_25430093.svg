<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 500" role="img" aria-labelledby="title desc">
  <title id="title">Perbaikan Pernyataan Kebutuhan Kabur</title>
  <desc id="desc">Perbandingan tiga kebutuhan awal dengan analisis dan kriteria yang lebih terukur.</desc>
  <style>
    .bg{fill:#0d1117}.title{fill:#e6edf3;font:700 25px Arial,sans-serif}.head{fill:#14263a}.a{fill:#111923}.b{fill:#17212c}.line{stroke:#435264;stroke-width:1}.h{fill:#dce7f2;font:700 14px Arial,sans-serif}.t{fill:#dce7f2;font:13px Arial,sans-serif}
  </style>
  <rect class="bg" width="1420" height="500" rx="12"/>
  <text class="title" x="24" y="42">Perbaikan Kebutuhan Kabur (Vague Requirements)</text>
  <rect class="head" x="20" y="62" width="1380" height="48"/>
  <rect class="a" x="20" y="110" width="1380" height="118"/><rect class="b" x="20" y="228" width="1380" height="118"/><rect class="a" x="20" y="346" width="1380" height="118"/>
  <g class="line"><path d="M20 62H1400M20 110H1400M20 228H1400M20 346H1400M20 464H1400"/><path d="M80 62V464M330 62V464M700 62V464M1400 62V464"/></g>
  <g class="h"><text x="38" y="91">No.</text><text x="98" y="91">Pernyataan Awal</text><text x="348" y="91">Analisis Masalah</text><text x="718" y="91">Perbaikan Kebutuhan</text></g>
  <g class="t">
    <text x="43" y="175">1</text><text x="98" y="151">"Data anggota harus aman."</text><text x="348" y="145">Kata "aman" terlalu umum dan belum mengatur</text><text x="348" y="165">mekanisme hak akses teknis.</text><text x="718" y="145">Nomor telepon dan alamat anggota hanya dapat dilihat ketua koperasi</text><text x="718" y="165">dan petugas yang memiliki hak akses pengelolaan anggota.</text>
    <text x="43" y="293">2</text><text x="98" y="269">"Sistem harus cepat mencari barang."</text><text x="348" y="263">Kata "cepat" bersifat subjektif tanpa batasan</text><text x="348" y="283">parameter waktu yang jelas.</text><text x="718" y="263">Pencarian berdasarkan kode atau nama barang tampil maksimal</text><text x="718" y="283">1,5 detik untuk kapasitas hingga 5.000 item.</text>
    <text x="43" y="411">3</text><text x="98" y="387">"Laporan stok harus akurat."</text><text x="348" y="381">Belum menjelaskan mekanisme perhitungan</text><text x="348" y="401">mutasi data stok.</text><text x="718" y="381">Nilai stok pada laporan sama dengan stok barang setelah seluruh</text><text x="718" y="401">transaksi penerimaan dan penjualan berhasil diproses.</text>
  </g>
</svg>
