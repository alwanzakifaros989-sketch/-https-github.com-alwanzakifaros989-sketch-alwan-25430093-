<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Lapisan validasi dan integritas data</title>
  <desc id="desc">Empat lapisan validasi meliputi nilai kolom, kunci, aturan proses, dan transaksi konsisten.</desc>
  <rect width="1200" height="340" rx="24" fill="#f4f7fb"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183153">LAPISAN VALIDASI DAN INTEGRITAS</text>
  <g font-family="Arial,sans-serif">
    <rect x="52" y="100" width="260" height="168" rx="17" fill="#e7f1ff" stroke="#3273c5" stroke-width="3"/>
    <text x="182" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#17365d">1. NILAI ATRIBUT</text>
    <text x="182" y="179" text-anchor="middle" font-size="16" fill="#30445d">Wajib isi, format, rentang,</text><text x="182" y="204" text-anchor="middle" font-size="16" fill="#30445d">dan daftar status yang sah</text>
    <text x="182" y="240" text-anchor="middle" font-size="14" fill="#52657c">contoh: denda tidak negatif</text>
    <path d="M322 185h34l-12-10m12 10-12 10" fill="none" stroke="#71849b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="365" y="100" width="260" height="168" rx="17" fill="#e8f7f1" stroke="#22936b" stroke-width="3"/>
    <text x="495" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#15583f">2. KUNCI &amp; RELASI</text>
    <text x="495" y="179" text-anchor="middle" font-size="16" fill="#30445d">PK, FK, UNIQUE, dan</text><text x="495" y="204" text-anchor="middle" font-size="16" fill="#30445d">referensi induk yang valid</text>
    <text x="495" y="240" text-anchor="middle" font-size="14" fill="#52657c">contoh: detail punya transaksi</text>
    <path d="M635 185h34l-12-10m12 10-12 10" fill="none" stroke="#71849b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="678" y="100" width="260" height="168" rx="17" fill="#fff3df" stroke="#df9221" stroke-width="3"/>
    <text x="808" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#7a4e0b">3. ATURAN PROSES</text>
    <text x="808" y="179" text-anchor="middle" font-size="16" fill="#30445d">Periksa kelayakan anggota</text><text x="808" y="204" text-anchor="middle" font-size="16" fill="#30445d">dan status eksemplar</text>
    <text x="808" y="240" text-anchor="middle" font-size="14" fill="#52657c">contoh: salinan hanya dipinjam sekali</text>
    <path d="M948 185h34l-12-10m12 10-12 10" fill="none" stroke="#71849b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="991" y="100" width="160" height="168" rx="17" fill="#f5edff" stroke="#8854b8" stroke-width="3"/>
    <text x="1071" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#57327a">4. TRANSAKSI</text>
    <text x="1071" y="179" text-anchor="middle" font-size="15" fill="#30445d">Simpan perubahan</text><text x="1071" y="204" text-anchor="middle" font-size="15" fill="#30445d">sebagai satu kesatuan</text>
    <text x="1071" y="240" text-anchor="middle" font-size="14" fill="#52657c">hindari data parsial</text>
  </g>
</svg>
