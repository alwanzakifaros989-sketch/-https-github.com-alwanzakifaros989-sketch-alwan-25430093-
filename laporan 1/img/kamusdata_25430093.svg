<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">Kamus Data Awal Kopma</title>
  <desc id="desc">Daftar elemen data utama Kopma, tipe, batasan, dan penanggung jawab.</desc>
  <style>
    .bg{fill:#0d1117}.title{fill:#e6edf3;font:700 26px Arial,sans-serif}.head{fill:#14263a}.cell{fill:#111923}.alt{fill:#17212c}.line{stroke:#435264;stroke-width:1}.h{fill:#dce7f2;font:700 14px Arial,sans-serif}.t{fill:#dce7f2;font:13px Arial,sans-serif}
  </style>
  <rect class="bg" width="1120" height="570" rx="12"/>
  <text class="title" x="24" y="42">Kamus Data Awal Kopma</text>
  <rect class="head" x="20" y="62" width="1080" height="48"/>
  <g class="cell">
    <rect x="20" y="110" width="1080" height="50"/><rect class="alt" x="20" y="160" width="1080" height="50"/>
    <rect x="20" y="210" width="1080" height="50"/><rect class="alt" x="20" y="260" width="1080" height="50"/>
    <rect x="20" y="310" width="1080" height="50"/><rect class="alt" x="20" y="360" width="1080" height="50"/>
    <rect x="20" y="410" width="1080" height="50"/><rect class="alt" x="20" y="460" width="1080" height="50"/>
  </g>
  <g class="line">
    <path d="M20 62H1100M20 110H1100M20 160H1100M20 210H1100M20 260H1100M20 310H1100M20 360H1100M20 410H1100M20 460H1100M20 510H1100"/>
    <path d="M20 62V510M220 62V510M370 62V510M745 62V510M920 62V510M1100 62V510"/>
  </g>
  <g class="h"><text x="34" y="92">Elemen Data</text><text x="234" y="92">Tipe / Panjang</text><text x="384" y="92">Keterangan / Batasan</text><text x="759" y="92">Penanggung Jawab</text><text x="934" y="92">Catatan</text></g>
  <g class="t">
    <text x="34" y="141">id_anggota</text><text x="234" y="141">VARCHAR(10)</text><text x="384" y="141">Primary Key, format KOPMA-XXXX</text><text x="759" y="141">Divisi HRD / Keanggotaan</text><text x="934" y="141">—</text>
    <text x="34" y="191">npm</text><text x="234" y="191">VARCHAR(8)</text><text x="384" y="191">Unique, contoh 25430093</text><text x="759" y="191">Divisi HRD / Keanggotaan</text><text x="934" y="191">—</text>
    <text x="34" y="241">nama_lengkap</text><text x="234" y="241">VARCHAR(100)</text><text x="384" y="241">Nama sesuai KMS / KTM</text><text x="759" y="241">Divisi HRD / Keanggotaan</text><text x="934" y="241">—</text>
    <text x="34" y="291">kode_barang</text><text x="234" y="291">VARCHAR(13)</text><text x="384" y="291">Primary Key / barcode standard</text><text x="759" y="291">Divisi Usaha &amp; Ritel</text><text x="934" y="291">—</text>
    <text x="34" y="341">harga_jual</text><text x="234" y="341">DECIMAL(12,2)</text><text x="384" y="341">Nilai minimum: 0</text><text x="759" y="341">Divisi Usaha &amp; Ritel</text><text x="934" y="341">—</text>
    <text x="34" y="391">stok</text><text x="234" y="391">INTEGER(6)</text><text x="384" y="391">Nilai minimum: 0</text><text x="759" y="391">Divisi Gudang</text><text x="934" y="391">—</text>
    <text x="34" y="441">no_faktur_jual</text><text x="234" y="441">VARCHAR(20)</text><text x="384" y="441">Primary Key, format TRX-YYYYMMDD-XXX</text><text x="759" y="441">Divisi Usaha &amp; Ritel</text><text x="934" y="441">—</text>
    <text x="34" y="491">jumlah_simpanan</text><text x="234" y="491">DECIMAL(12,2)</text><text x="384" y="491">Nilai transaksi simpanan</text><text x="759" y="491">Bendahara</text><text x="934" y="491">—</text>
  </g>
</svg>
