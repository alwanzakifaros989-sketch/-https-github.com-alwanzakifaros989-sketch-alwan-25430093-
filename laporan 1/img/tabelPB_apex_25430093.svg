<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">Proses Bisnis Apex Tech</title>
  <desc id="desc">Ringkasan proses bisnis yang dijelaskan untuk proyek Apex Tech.</desc>
  <style>
    .bg{fill:#0d1117}.title{fill:#e6edf3;font:700 26px Arial,sans-serif}.head{fill:#14263a}.a{fill:#111923}.b{fill:#17212c}.line{stroke:#435264;stroke-width:1}.h{fill:#dce7f2;font:700 15px Arial,sans-serif}.t{fill:#dce7f2;font:14px Arial,sans-serif}
  </style>
  <rect class="bg" width="1100" height="490" rx="12"/><text class="title" x="24" y="42">Proses Bisnis Apex Tech</text>
  <rect class="head" x="20" y="62" width="1060" height="48"/>
  <g class="a">
    <rect x="20" y="110" width="1060" height="60"/><rect class="b" x="20" y="170" width="1060" height="60"/>
    <rect x="20" y="230" width="1060" height="60"/><rect class="b" x="20" y="290" width="1060" height="60"/>
    <rect x="20" y="350" width="1060" height="60"/><rect class="b" x="20" y="410" width="1060" height="60"/>
  </g>
  <g class="line"><path d="M20 62H1080M20 110H1080M20 170H1080M20 230H1080M20 290H1080M20 350H1080M20 410H1080M20 470H1080"/><path d="M150 62V470M440 62V470M1080 62V470"/></g>
  <g class="h"><text x="34" y="91">Kode</text><text x="164" y="91">Proses Bisnis</text><text x="454" y="91">Ringkasan</text></g>
  <g class="t">
    <text x="34" y="146">PB-01</text><text x="164" y="146">Pendaftaran Anggota</text><text x="454" y="146">Mencatat data pelanggan dan anggota terdaftar.</text>
    <text x="34" y="206">PB-02</text><text x="164" y="206">Pengelolaan Produk</text><text x="454" y="206">Mengelola kategori, komponen barang, harga, dan stok.</text>
    <text x="34" y="266">PB-03</text><text x="164" y="266">Penjualan Ritel</text><text x="454" y="266">Mencatat transaksi penjualan perangkat keras dan aksesoris.</text>
    <text x="34" y="326">PB-04</text><text x="164" y="326">Layanan Rakit PC</text><text x="454" y="326">Mencatat layanan perakitan PC kustom.</text>
    <text x="34" y="386">PB-05</text><text x="164" y="386">Pengelolaan Supplier</text><text x="454" y="386">Mengelola pemasok dan penerimaan stok barang.</text>
    <text x="34" y="446">PB-06</text><text x="164" y="446">Laporan Operasional</text><text x="454" y="446">Menyediakan laporan penjualan, stok, dan operasional.</text>
  </g>
</svg>
