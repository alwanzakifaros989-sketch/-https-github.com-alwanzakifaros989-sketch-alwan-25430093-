<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Tahapan pemodelan basis data</title>
  <desc id="desc">Tahap konseptual, logis, dan fisik beserta hasil utama tiap tahap.</desc>
  <rect width="1200" height="330" rx="24" fill="#f4f7fb"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183153">TAHAPAN PEMODELAN BASIS DATA</text>
  <g font-family="Arial,sans-serif">
    <rect x="45" y="100" width="325" height="165" rx="18" fill="#e7f1ff" stroke="#3273c5" stroke-width="3"/>
    <circle cx="88" cy="140" r="23" fill="#3273c5"/><text x="88" y="148" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text>
    <text x="125" y="148" font-size="23" font-weight="700" fill="#17365d">KONSEPTUAL</text>
    <text x="72" y="193" font-size="18" fill="#30445d">Objek, kebutuhan, aturan bisnis</text>
    <text x="72" y="223" font-size="16" fill="#52657c">Hasil: ERD konseptual</text>
    <path d="M390 182h55l-13-13m13 13-13 13" fill="none" stroke="#70839a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="455" y="100" width="325" height="165" rx="18" fill="#e8f7f1" stroke="#22936b" stroke-width="3"/>
    <circle cx="498" cy="140" r="23" fill="#22936b"/><text x="498" y="148" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text>
    <text x="535" y="148" font-size="23" font-weight="700" fill="#15583f">LOGIS</text>
    <text x="482" y="193" font-size="18" fill="#30445d">Tabel, kunci, relasi, normalisasi</text>
    <text x="482" y="223" font-size="16" fill="#52657c">Hasil: skema relasional</text>
    <path d="M800 182h55l-13-13m13 13-13 13" fill="none" stroke="#70839a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="865" y="100" width="290" height="165" rx="18" fill="#fff3df" stroke="#df9221" stroke-width="3"/>
    <circle cx="908" cy="140" r="23" fill="#df9221"/><text x="908" y="148" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text>
    <text x="945" y="148" font-size="23" font-weight="700" fill="#7a4e0b">FISIK</text>
    <text x="892" y="193" font-size="18" fill="#30445d">Tipe data, indeks, constraint</text>
    <text x="892" y="223" font-size="16" fill="#52657c">Hasil: implementasi DBMS</text>
